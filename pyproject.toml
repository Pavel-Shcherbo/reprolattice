[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprolattice"
version = "0.1.0"
description = "Turn an HTTP failure case into a portable, verifiable scenario."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["reprolattice"]

[tool.setuptools.package-data]
reprolattice = ["static/*"]
