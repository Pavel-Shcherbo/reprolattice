[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprolattice"
version = "0.2.0"
description = "Reproduce HTTP, queue and database regressions with retained evidence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{name = "Pavel Shcherbo"}]
license = {file = "LICENSE"}
keywords = ["regression-testing", "http", "sqlite", "message-queues"]

[project.urls]
Homepage = "https://github.com/Pavel-Shcherbo/reprolattice"
Repository = "https://github.com/Pavel-Shcherbo/reprolattice"
Documentation = "https://github.com/Pavel-Shcherbo/reprolattice/blob/main/docs/README.md"
Issues = "https://github.com/Pavel-Shcherbo/reprolattice/issues"
Discussions = "https://github.com/Pavel-Shcherbo/reprolattice/discussions"

[tool.setuptools]
packages = ["reprolattice"]

[tool.setuptools.package-data]
reprolattice = ["static/*"]

[tool.setuptools.cmdclass]
build_py = "_build.PackagedExamples"
