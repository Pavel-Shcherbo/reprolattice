[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprolattice"
version = "0.2.0"
description = "Reproduce HTTP, queue and database regressions with retained evidence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["reprolattice"]

[tool.setuptools.package-data]
reprolattice = ["static/*"]

[tool.setuptools.cmdclass]
build_py = "_build.PackagedExamples"
